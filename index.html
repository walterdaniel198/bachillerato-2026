<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="description" content="Horarios y accesos del Bachillerato Acelerado 2026" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bachillerato" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <title>Bachillerato Acelerado</title>
  <style>
    :root{color-scheme:dark;--bg:#020617;--card:#0f172a;--border:#1e293b;--muted:#94a3b8;--indigo:#a5b4fc}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,a{font:inherit}.app{max-width:460px;min-height:100vh;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--indigo);font-weight:800}.title{font-size:25px;margin:5px 0 0}.logo{width:46px;height:46px;border-radius:16px;background:#312e8155;border:1px solid #818cf833;display:grid;place-items:center;font-size:24px}
    .hero{border-radius:28px;padding:22px;background:linear-gradient(135deg,#4f46e5,#7c3aed,#c026d3);box-shadow:0 22px 50px #312e8155}.hero.live{background:linear-gradient(135deg,#059669,#16a34a,#0f766e);box-shadow:0 22px 50px #064e3b66}.heroTop{display:flex;justify-content:space-between;gap:12px}.status{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#ffffffdd}.dot{width:10px;height:10px;background:#ffffffbb;border-radius:50%}.live .dot{background:#f87171;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(1.3)}}.hero h2{font-size:25px;margin:9px 0 0}.day{background:#ffffff22;padding:9px 12px;border-radius:12px;height:max-content;font-size:14px;font-weight:800}.meta{margin-top:20px;display:grid;gap:6px;font-size:14px;color:#ffffffe8}.countdown{font-weight:900;color:white}.join{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;padding:14px;border-radius:16px;background:#fff;color:#4338ca;text-decoration:none;font-weight:900}
    .heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.heading h3{margin:0;font-size:19px}.linkBtn,.navBtn{border:0;background:none;color:var(--indigo);font-weight:800;cursor:pointer}.cards{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:grid;grid-template-columns:6px 1fr;gap:13px}.bar{border-radius:999px;background:linear-gradient(#6366f1,#06b6d4)}.card h4{margin:0;font-size:16px}.small{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.4}.email{color:#a5b4fc;text-decoration:none;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:13px}.action{flex:1;text-align:center;padding:10px;background:#6366f126;color:#c7d2fe;border-radius:12px;text-decoration:none;font-size:14px;font-weight:800}.action.green{background:#10b98122;color:#6ee7b7}.weekDay{margin-top:22px}.weekDay h3{font-size:13px;color:#94a3b8;letter-spacing:.12em;text-transform:uppercase}.notice{margin-top:22px;padding:16px;border:1px solid #f59e0b33;background:#f59e0b0d;border-radius:18px;color:#fde68a}.empty{text-align:center;color:#94a3b8;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:18px}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:flex;justify-content:space-around;padding:12px 24px calc(12px + env(safe-area-inset-bottom));background:#020617ee;backdrop-filter:blur(14px);border-top:1px solid var(--border)}.navBtn{color:#64748b;display:grid;gap:3px}.navBtn.active{color:var(--indigo)}
  </style>
</head>
<body><div id="app"></div>
<script>
const clases=[
 {dia:'Lunes',inicio:'18:00',fin:'19:00',materia:'Proyecto y Adscripta',profe:'Melisa Carras',link:'https://meet.google.com/hzb-eumj-ypk',detalle:'Licencias médicas, días de estudio, etc.',email:'Bachillerato.acelerado2026@gmail.com'},
 {dia:'Lunes',inicio:'19:00',fin:'20:35',materia:'Análisis y Producción de Textos',profe:'Sofia de Marco',link:'https://meet.google.com/oys-wxvo-nry',email:'demarcorivas@gmail.com',telefono:'098 000 194',classroom:'https://classroom.google.com/c/ODcwMDU0MTcxNjM5'},
 {dia:'Martes',inicio:'20:00',fin:'21:30',materia:'Biología / Química',profe:'Daiana Siré / Rafael Sauto',link:'https://meet.google.com/dsg-thbg-woy'},
 {dia:'Miércoles',inicio:'19:00',fin:'20:35',materia:'Matemáticas / Física',profe:'Laura Valls / Sofia Dominichi',link:'https://meet.google.com/wte-zcyn-fhm',detalle:'Comunicación por mensajes de CREA y en Foros'},
 {dia:'Miércoles',inicio:'21:30',fin:'22:15',materia:'Seguridad / Gestión',profe:'Lucia / Mauricio Teliz',link:'https://meet.google.com/aza-dzfg-yzq?authuser=0',email:'lucialg.docente@gmail.com'},
 {dia:'Jueves',inicio:'19:50',fin:'20:35',materia:'Filosofía / Historia',profe:'Profesor/a no indicado',link:'https://meet.google.com/kvw-qjqe-dwb'},
 {dia:'Viernes',inicio:'19:00',fin:'19:45',materia:'Tecnologías Digitales / Costos',profe:'Profesor/a no indicado',link:'https://us05web.zoom.us/j/81824977971?pwd=vJkLQyNxtBgTOjR3hN6jnTGVplsFTS.1',detalle:'Zoom · ID: 818 2497 7971 · Código: 4KJKR3'}
];
const orden=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];let vista='inicio';
const min=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
function card(c){return `<article class="card"><div class="bar"></div><div><h4>${c.materia}</h4><p class="small">🕒 ${c.inicio} – ${c.fin}</p><p class="small">👥 ${c.profe}</p>${c.detalle?`<p class="small">${c.detalle}</p>`:''}${c.email?`<a class="small email" href="mailto:${c.email}">✉ ${c.email}</a>`:''}${c.telefono?`<p class="small">Tel. ${c.telefono}</p>`:''}<div class="actions"><a class="action" href="${c.link}" target="_blank" rel="noopener">🎥 Entrar</a>${c.classroom?`<a class="action green" href="${c.classroom}" target="_blank" rel="noopener">📚 Classroom</a>`:''}</div></div></article>`}
function estado(){const ahora=new Date(),hoy=orden[ahora.getDay()],m=ahora.getHours()*60+ahora.getMinutes(),hoyClases=clases.filter(c=>c.dia===hoy),enCurso=hoyClases.find(c=>m>=min(c.inicio)&&m<min(c.fin));const prox=clases.map(c=>{let dias=(orden.indexOf(c.dia)-ahora.getDay()+7)%7;const ini=min(c.inicio);if(dias===0&&ini<=m)dias=7;return{...c,dist:dias*1440+ini-(dias===0?m:0)}}).sort((a,b)=>a.dist-b.dist)[0];const sig=enCurso||prox;const faltan=enCurso?min(enCurso.fin)-m:prox.dist;const texto=enCurso?`Termina en ${faltan} min`:faltan<60?`Empieza en ${faltan} min`:faltan<1440?`Empieza en ${Math.floor(faltan/60)} h ${faltan%60} min`:`${prox.dia} · ${prox.inicio}`;return{hoy,hoyClases,enCurso,sig,texto}}
function render(){const s=estado();document.getElementById('app').innerHTML=`<div class="app"><header><div><div class="eyebrow">Panel del curso</div><h1 class="title">Bachillerato Acelerado</h1></div><div class="logo">🎓</div></header>${vista==='inicio'?`<main><section class="hero ${s.enCurso?'live':''}"><div class="heroTop"><div><div class="status"><span class="dot"></span>${s.enCurso?'Clase en curso':'Próxima clase'}</div><h2>${s.sig.materia}</h2></div><div class="day">${s.sig.dia}</div></div><div class="meta"><span>🕒 ${s.sig.inicio} – ${s.sig.fin}</span><span class="countdown">${s.texto}</span><span>👥 ${s.sig.profe}</span></div><a class="join" href="${s.sig.link}" target="_blank" rel="noopener">🎥 ${s.enCurso?'ENTRAR AHORA':'ENTRAR A LA CLASE'}</a></section><div class="heading"><h3>Hoy · ${s.hoy}</h3><button class="linkBtn" onclick="showWeek()">Ver semana</button></div><section class="cards">${s.hoyClases.length?s.hoyClases.map(card).join(''):'<div class="empty">No hay clases cargadas para hoy 🎉</div>'}</section></main>`:`<main><div class="heading"><h3>Horario semanal</h3><button class="linkBtn" onclick="showHome()">Inicio</button></div>${['Lunes','Martes','Miércoles','Jueves','Viernes'].map(d=>`<section class="weekDay"><h3>${d}</h3><div class="cards">${clases.filter(c=>c.dia===d).map(card).join('')}</div></section>`).join('')}<div class="notice"><strong>Inglés</strong><div class="small">Actualmente sin profesora.</div></div></main>`}<nav><button class="navBtn ${vista==='inicio'?'active':''}" onclick="showHome()">🎓<span>Inicio</span></button><button class="navBtn ${vista==='horario'?'active':''}" onclick="showWeek()">📅<span>Horario</span></button></nav></div>`}
window.showHome=()=>{vista='inicio';render()};window.showWeek=()=>{vista='horario';render()};render();setInterval(()=>{if(vista==='inicio')render()},30000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
